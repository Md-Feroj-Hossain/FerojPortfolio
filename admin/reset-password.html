
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
</head>
<body>
  <h2>Reset Your Password</h2>

  <form id="resetForm">
    <input type="password" id="password"
      placeholder="New password" minlength="6" required>
    <input type="password" id="confirmPassword"
      placeholder="Confirm password" minlength="6" required>
    <button type="submit">Update Password</button>
  </form>

  <p id="message">Verifying recovery link...</p>

  <script>
    const config = window.PORTFOLIO_CONFIG;
    const message = document.getElementById("message");

    const client = window.supabase.createClient(
      config.supabaseUrl,
      config.supabaseAnonKey,
      {
        auth: {
          detectSessionInUrl: true,
          persistSession: true,
          autoRefreshToken: true
        }
      }
    );

    async function verifyRecovery() {
      try {
        const hash = window.location.hash;

        if (hash.includes("error=")) {
          throw new Error(
            new URLSearchParams(hash.substring(1)).get("error_description")
            || "Recovery link is invalid or expired."
          );
        }

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          message.textContent =
            "Recovery session missing. Please request a new recovery email.";
          return;
        }

        message.textContent = "Recovery verified. Enter your new password.";
      } catch (error) {
        message.textContent = error.message;
      }
    }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }

      message.textContent = "Updating password...";

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Password updated successfully. You can now log in.";
      document.getElementById("resetForm").reset();
    });

    verifyRecovery();
  </script>
</body>
</html>
